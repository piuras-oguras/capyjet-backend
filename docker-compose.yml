services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capyjet
      POSTGRES_USER: capyjet
      POSTGRES_PASSWORD: capyjet
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capyjet"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/capyjet
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
